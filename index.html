<!DOCTYPE html>
<html lang="pt- BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css"/>
    <link rel="shortcut icon" href="img/sapato.png" type="image/x-icon">
    <title>Tênis NIKE</title>
  </head>
  <body>
    <div class="container-father">
      <header>
        <div><img src="img/nike-logo.webp" alt="nike" /></div>
        <nav>
          <ul>
            <li>INÍCIO</li>
            <li>SHOP</li>
            <li>SOBRE NÓS</li>
            <li>CONTATOS</li>
          </ul>
        </nav>
        <div class="btn-login">
          <button class="btn-cadastre">CADASTRE-SE</button>
          <button class="btn-entrar">ENTRAR</button>
        </div>
      </header>
      <div class="slider vermelho">
        <div class="slide red active">
          <div class="nike">
            <h3>NIKE</h3>
            <h3>NIKE</h3>
          </div>
          <img class="red"  src="img/vermelho-principal.webp" alt="Vermelho" />
        </div>
        <div class="slide cinza">
          <div class="nike">
            <h3>NIKE</h3>
            <h3>NIKE</h3>
          </div>
          <img class="red"  src="img/cinza-principal.webp" alt="cinza" />
        </div>
        <div class="slide marrom">
          <div class="nike">
            <h3>NIKE</h3>
            <h3>NIKE</h3>
          </div>
          <img class="red"  src="img/marrom-principal.webp" alt="marrom" />
        </div>
        <div class="slide verde">
          <div class="nike">
            <h3>NIKE</h3>
            <h3>NIKE</h3>
          </div>
          <img class="red"  src="img/verde-principal.webp" alt="verde" />
        </div>
      </div>
      <div class="inferior">
        <div class="left">
          <img src="img/text-vermelho.webp" alt="text" />
          <h2>NIKE AIR JORDAN <small>2025</small></h2>
        </div>
        <div class="right">
            <div class="shoes active">
              <img src="img/vermelho-botao.webp" alt="vermelho" />
            </div>
            <div class="shoes">
              <img src="img/cinza-botao.webp" alt="cinza" />
            </div>
            <div class="shoes">
              <img src="img/marrom-botao.webp"  alt= "marrom" />
            </div>
            <div class="shoes">
              <img src="img/verde-botao.webp" alt="verde" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="js/nike.js" defer></script>
</html>
